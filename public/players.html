<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курсы валют по серверам — PCStats</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --border:#262b36;
    --text:#e7e9ee; --dim:#8a90a0; --accent:#3aa0ff; --gold:#e0b94a; --green:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #17203a 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh;
  }

  /* ---------- топбар + выдвижное меню ---------- */
  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(15,17,21,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--border)}
  .hbtn{background:var(--card); border:1px solid var(--border); color:var(--text); font-size:18px; width:38px; height:38px; border-radius:8px; cursor:pointer; line-height:1}
  .hbtn:hover{border-color:var(--accent)}
  .brand{font-weight:700; font-size:15px}
  .drawerOverlay{position:fixed; inset:0; background:rgba(6,8,12,.55); display:none; z-index:40}
  .drawerOverlay.open{display:block}
  .drawer{position:fixed; top:0; left:0; bottom:0; width:250px; max-width:80vw; background:var(--card); border-right:1px solid var(--border); z-index:50; transform:translateX(-100%); transition:transform .2s ease; display:flex; flex-direction:column; padding:14px 0}
  .drawer.open{transform:translateX(0)}
  .drawerHead{padding:8px 18px 14px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); margin-bottom:8px}
  .dlink{display:flex; align-items:center; gap:10px; padding:11px 18px; color:var(--text); text-decoration:none; font-size:14.5px}
  .dlink:hover{background:#1c2029}
  .dlink.active{color:var(--accent); font-weight:600}

  .wrap{max-width:960px; margin:0 auto; padding:24px 16px 60px}
  header{margin-bottom:20px}
  h1{font-size:22px; margin:0; font-weight:600}
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  input[type=text], select{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:14px; min-width:200px;
  }
  select{min-width:170px}
  .meta{color:var(--dim); font-size:13px}
  .tableWrap{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  table{width:100%; border-collapse:collapse; min-width:560px}
  thead th{
    text-align:left; padding:10px 12px; font-size:12px; text-transform:uppercase;
    letter-spacing:.03em; color:var(--dim); border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:10px 12px; font-size:14px; border-bottom:1px solid var(--border); white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#1c2029}
  .server{font-weight:600}
  .num{color:var(--gold); font-variant-numeric:tabular-nums}
  .updated{color:var(--dim); font-size:12px}
  .fresh{color:var(--green)}
  .empty{padding:40px; text-align:center; color:var(--dim)}

  /* ---------- responsive ---------- */
  @media (max-width: 640px){
    h1{font-size:18px}
    .toolbar{gap:8px}
    input[type=text], select{min-width:0; flex:1 1 140px; font-size:13px; padding:9px 10px}
    thead th, tbody td{padding:8px 9px; font-size:12.5px}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="hbtn" id="hbtn" aria-label="Меню">☰</button>
  <div class="brand">PC Stats</div>
</div>
<div class="drawerOverlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer">
  <div class="drawerHead">Меню</div>
  <a href="/" class="dlink">🏠 Главная</a>
  <a href="/rates.html" class="dlink active">💱 Курс валют</a>
  <a href="/players.html" class="dlink">🧑‍🤝‍🧑 Игроки</a>
</nav>

<div class="wrap">
  <header>
    <h1>💱 Курсы валют по серверам</h1>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Поиск сервера…">
    <select id="serverSelect"><option value="">Все серверы</option></select>
    <span class="meta" id="count"></span>
  </div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Сервер</th>
          <th>AZ-Coins</th>
          <th>BTC</th>
          <th>Евро</th>
          <th>VC$</th>
          <th>ASC</th>
          <th>Обновлено</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg" style="display:none">Пока нет данных — курсы появятся здесь после первого обновления с телефона в скрипте.</div>
</div>

<script>
// полный список серверов Arizona RP (из ARZ_WIKI_RATES в PCStats.lua) —
// показывается в выпадающем списке независимо от того, прислал ли уже
// скрипт данные по этому серверу
const ARIZONA_SERVERS = [
  "Brainburg","Bumble Bee","Casa Grande","Chandler","Christmas","Drake","Faraway",
  "Gilbert","Glendale","Holiday","Kingman","Love","Mesa","Mirage","Mobile 1",
  "Mobile 2","Mobile 3","Page","Payson","Phoenix","Prescott","Queen Creek",
  "Red Rock","Saint Rose","Scottdale","Sedona","Show Low","Space","Sun City",
  "Surprise","Tucson","Vice City","Wednesday","Winslow","Yava","Yuma"
];

const STORAGE_KEY = "pcstats_selected_server";

let allRows = [];

function fmtAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "только что";
  const m = Math.floor(s/60);
  if (m < 60) return m + " мин назад";
  const h = Math.floor(m/60);
  if (h < 24) return h + " ч назад";
  const d = Math.floor(h/24);
  return d + " дн назад";
}

function fmtNum(n){
  if (!n) return "—";
  return Number(n).toLocaleString("ru-RU");
}

function initServerSelect(){
  const sel = document.getElementById("serverSelect");
  sel.innerHTML = '<option value="">Все серверы</option>' +
    ARIZONA_SERVERS.map(s => `<option value="${s}">${s}</option>`).join("");
  // восстанавливаем ранее выбранный сервер, чтобы он не сбрасывался
  // на "Все серверы" при каждом обновлении страницы
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved && ARIZONA_SERVERS.includes(saved)) {
    sel.value = saved;
  }
}

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const srv = document.getElementById("serverSelect").value;
  const rows = allRows.filter(r =>
    r.server.toLowerCase().includes(q) &&
    (!srv || r.server.trim().toLowerCase() === srv.trim().toLowerCase())
  );
  document.getElementById("count").textContent = rows.length + " сервер(ов)";
  document.getElementById("emptyMsg").style.display = allRows.length ? "none" : "block";

  document.getElementById("rows").innerHTML = rows.map(r => {
    const fresh = (Date.now() - r.updatedAt) < 10*60*1000;
    return `<tr>
      <td class="server">${r.server}</td>
      <td class="num">${fmtNum(r.az)}</td>
      <td class="num">${fmtNum(r.btc)}</td>
      <td class="num">${fmtNum(r.eur)}</td>
      <td class="num">${fmtNum(r.vc)}</td>
      <td class="num">${fmtNum(r.asc)}</td>
      <td class="updated ${fresh ? "fresh" : ""}">${fmtAgo(r.updatedAt)}</td>
    </tr>`;
  }).join("");
}

async function load(){
  try{
    const res = await fetch("/api/rates");
    const data = await res.json();
    allRows = data.servers || [];
    render();
  }catch(e){
    console.error(e);
  }
}

initServerSelect();
document.getElementById("search").addEventListener("input", render);
document.getElementById("serverSelect").addEventListener("change", e => {
  localStorage.setItem(STORAGE_KEY, e.target.value);
  render();
});
load();
setInterval(load, 30000); // авто-обновление раз в 30 сек

/* ---------- выдвижное меню ---------- */
(function(){
  const btn = document.getElementById("hbtn");
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("drawerOverlay");
  function open(){ drawer.classList.add("open"); overlay.classList.add("open"); }
  function close(){ drawer.classList.remove("open"); overlay.classList.remove("open"); }
  btn.addEventListener("click", open);
  overlay.addEventListener("click", close);
  document.querySelectorAll(".dlink").forEach(a => a.addEventListener("click", close));
})();
</script>
</body>
</html>
